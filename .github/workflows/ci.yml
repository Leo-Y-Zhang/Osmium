name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p kernel -p kshared --target x86_64-unknown-none --features selftest -- -D warnings
      - run: cargo clippy -p xtask -- -D warnings

  # The kernel must stay free of nightly features; only the image-builder
  # tooling is allowed to need the pinned nightly.
  stable-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable build -p kernel --target x86_64-unknown-none --features selftest

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kshared

  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot selftest (${{ matrix.firmware }})
        run: cargo xtask test --${{ matrix.firmware }} | tee serial-${{ matrix.firmware }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-${{ matrix.firmware }}
          path: serial-*.log
