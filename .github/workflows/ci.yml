name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p kernel -p kshared --target x86_64-unknown-none --features selftest -- -D warnings
      # The shipped configuration too: the shell only compiles without the
      # selftest feature, so one invocation alone would never lint it.
      - run: cargo clippy -p kernel --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy -p xtask -- -D warnings

  # The kernel is allowed exactly ONE unstable feature: abi_x86_interrupt,
  # which IDT handlers require. This gate fails the build if any other
  # nightly feature creeps into kernel or kshared source.
  feature-allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          found="$(grep -rho '#!\[feature([^)]*)\]' kernel/src kshared/src | sort -u || true)"
          echo "unstable features found: ${found:-none}"
          test "$found" = '#![feature(abi_x86_interrupt)]'

  # Privacy pillar, enforced structurally: no network or storage code may
  # enter the kernel. Greps sources and manifests for driver and protocol
  # tokens, AND greps the RESOLVED kernel dependency graph so a transitive
  # crate cannot smuggle networking in unseen. A hit fails the build.
  no-network-no-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - shell: bash
        # Explicit if/exit, not `! grep`: set -e ignores the failure of an
        # inverted command, which made the first version of this gate inert.
        run: |
          net='smoltcp|\btcp\b|\budp\b|socket|ethernet|e1000|virtio|dhcp|\bdns\b|\bhttp\b'
          storage='fatfs|ext[234]|nvme|ahci|\bata\b|\bide\b|\bsata\b'
          srcs="kernel/src kshared/src kernel/Cargo.toml kshared/Cargo.toml"
          if grep -riE "$net" $srcs; then
            echo "network token found in the kernel tree" >&2; exit 1
          fi
          if grep -riE "$storage" $srcs; then
            echo "storage token found in the kernel tree" >&2; exit 1
          fi
          # The resolved graph: xtask's host-side fatfs/gpt stay invisible here
          # because we scope to the kernel crate only.
          tree="$(cargo tree -p kernel --target x86_64-unknown-none --edges normal --prefix none | sort -u)"
          echo "$tree"
          if echo "$tree" | grep -iE "$net|$storage"; then
            echo "network or storage crate links into the kernel" >&2; exit 1
          fi
          echo "no network or storage tokens in the kernel sources, manifests or dependency graph"

  # Structural tripwire for the keystroke-privacy claim: the input path must
  # contain no serial or logging call, so a typed byte has no route off-device.
  # (The behavioural proof is the sendkey serial-silence test in boot-shipped.)
  input-path-has-no-serial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          if grep -nE 'serial_print|log::' kernel/src/shell.rs kernel/src/task/keyboard.rs; then
            echo "the input path writes to serial or the log; keystrokes could leak" >&2
            exit 1
          fi
          echo "input path is free of serial and log calls"

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kshared

  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot selftest (${{ matrix.firmware }})
        # shell: bash is load-bearing: it turns on pipefail, without which a
        # failed boot would be masked by tee's exit status and go green.
        shell: bash
        run: cargo xtask test --${{ matrix.firmware }} | tee serial-${{ matrix.firmware }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-${{ matrix.firmware }}
          path: serial-*.log

  # The battery proves the selftest build; this proves the image users
  # actually boot reaches the shell.
  boot-shipped:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot the shipped image
        # shell: bash for pipefail — see the boot-test note.
        shell: bash
        run: cargo xtask test --shipped | tee serial-shipped.log
      - name: Keystroke-privacy proof (typed input never reaches serial)
        shell: bash
        run: cargo xtask privacy | tee serial-privacy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-shipped
          path: serial-*.log
