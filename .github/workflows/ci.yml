name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# One in-flight run per ref: a rapid push sequence cancels the superseded runs
# instead of queueing a boot matrix behind each.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p kernel -p kshared --target x86_64-unknown-none --features selftest -- -D warnings
      # The shipped configuration too: the shell only compiles without the
      # selftest feature, so one invocation alone would never lint it.
      - run: cargo clippy --locked -p kernel --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy --locked -p xtask -- -D warnings

  # The kernel is allowed exactly ONE unstable feature: abi_x86_interrupt,
  # which IDT handlers require. This gate fails the build if any other
  # nightly feature creeps into kernel or kshared source. It matches the
  # feature-enabling call shape `feature(...)` regardless of carrier, so a
  # `#![cfg_attr(..., feature(...))]` cannot slip past the plain-attribute
  # regex the first version used. (Cargo-feature cfgs use `feature = "..."`,
  # never `feature(...)`, so there is no collision.)
  feature-allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          for p in kernel/src kshared/src; do
            test -e "$p" || { echo "gate path missing: $p" >&2; exit 1; }
          done
          found="$(grep -rhoE 'feature\([a-zA-Z_0-9, ]+\)' kernel/src kshared/src | sort -u || true)"
          echo "feature-enabling attributes found: ${found:-none}"
          test "$found" = 'feature(abi_x86_interrupt)'

  # Privacy pillar, enforced structurally: no network or storage code may
  # enter the kernel. Greps sources and manifests for driver and protocol
  # tokens, AND greps the RESOLVED kernel dependency graph so a transitive
  # crate cannot smuggle networking in unseen. A hit fails the build.
  no-network-no-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - shell: bash
        # Two hardening rules, both learned from gates that could not fail:
        # (1) explicit if/exit, not `! grep` — set -e ignores an inverted
        # command's failure; (2) grep's exit code is captured and ONLY 1
        # (searched, no match) passes — `if grep` treats a grep ERROR (exit
        # 2, e.g. a renamed path) the same as "no match" and the gate would
        # silently pass forever after a refactor. Paths are also preflighted.
        run: |
          net='smoltcp|\btcp\b|\budp\b|socket|ethernet|e1000|rtl8139|ne2k|ne2000|pcnet|802\.11|wifi|\bnic\b|\bpacket\b|virtio|dhcp|\bdns\b|\bhttp\b'
          storage='fatfs|ext[234]|nvme|ahci|\bata\b|\bide\b|\bsata\b|floppy|\bfdc\b|\bscsi\b|\blba\b|\bsector\b|sdhci'
          srcs="kernel/src kshared/src user kernel/Cargo.toml kshared/Cargo.toml"
          for p in $srcs; do
            test -e "$p" || { echo "gate path missing: $p" >&2; exit 1; }
          done
          rc=0; grep -riE "$net" $srcs || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "network token found (or grep error, rc=$rc) in the kernel tree" >&2; exit 1
          fi
          rc=0; grep -riE "$storage" $srcs || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "storage token found (or grep error, rc=$rc) in the kernel tree" >&2; exit 1
          fi
          # The resolved graph: xtask's host-side fatfs/gpt stay invisible here
          # because we scope to the kernel crate only.
          tree="$(cargo tree -p kernel --target x86_64-unknown-none --edges normal --prefix none | sort -u)"
          echo "$tree"
          rc=0; echo "$tree" | grep -iE "$net|$storage" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "network or storage crate links into the kernel (or grep error, rc=$rc)" >&2; exit 1
          fi
          echo "no network or storage tokens in the kernel sources, manifests or dependency graph"

  # Structural tripwire for the keystroke-privacy claim: the input path must
  # contain no serial or logging call, so a typed byte has no route off-device.
  # (The behavioural proof is the sendkey serial-silence test in boot-shipped.)
  input-path-has-no-serial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        # Same discipline as the no-network gate: paths preflighted, and only
        # grep exit 1 (searched, found nothing) passes — a renamed file must
        # fail the gate, not disarm it.
        run: |
          files="kernel/src/shell.rs kernel/src/task/keyboard.rs"
          for p in $files; do
            test -e "$p" || { echo "gate path missing: $p" >&2; exit 1; }
          done
          rc=0; grep -nE 'serial_print|log::' $files || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "the input path writes to serial or the log (or grep error, rc=$rc); keystrokes could leak" >&2
            exit 1
          fi
          echo "input path is free of serial and log calls"

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p kshared -p xtask

  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot selftest (${{ matrix.firmware }})
        # shell: bash is load-bearing: it turns on pipefail, without which a
        # failed boot would be masked by tee's exit status and go green.
        shell: bash
        run: cargo xtask test --${{ matrix.firmware }} | tee serial-${{ matrix.firmware }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-${{ matrix.firmware }}
          path: serial-*.log

  # The battery proves the selftest build; this proves the image users
  # actually boot reaches the shell — on BOTH firmwares, since a UEFI-only
  # shipped regression would otherwise only surface on a release tag.
  boot-shipped:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot the shipped image (${{ matrix.firmware }})
        # shell: bash for pipefail — see the boot-test note.
        shell: bash
        run: cargo xtask test --shipped --${{ matrix.firmware }} | tee serial-shipped-${{ matrix.firmware }}.log
      # Keystroke privacy is a BIOS-side proof (the sendkey path is identical
      # on both firmwares; running it once is enough).
      - name: Keystroke-privacy proof (typed input never reaches serial)
        if: matrix.firmware == 'bios'
        shell: bash
        run: cargo xtask privacy | tee serial-privacy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-shipped-${{ matrix.firmware }}
          path: serial-*.log
