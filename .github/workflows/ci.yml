name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p kernel -p kshared --target x86_64-unknown-none --features selftest -- -D warnings
      # The shipped configuration too: the shell only compiles without the
      # selftest feature, so one invocation alone would never lint it.
      - run: cargo clippy -p kernel --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy -p xtask -- -D warnings

  # The kernel is allowed exactly ONE unstable feature: abi_x86_interrupt,
  # which IDT handlers require. This gate fails the build if any other
  # nightly feature creeps into kernel or kshared source.
  feature-allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          found="$(grep -rho '#!\[feature([^)]*)\]' kernel/src kshared/src | sort -u || true)"
          echo "unstable features found: ${found:-none}"
          test "$found" = '#![feature(abi_x86_interrupt)]'

  # Privacy pillar, enforced structurally: no network or storage code may
  # enter the kernel. Greps sources and the kernel manifest for driver and
  # protocol tokens; a hit fails the build and forces a deliberate decision.
  no-network-no-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        # Explicit if/exit, not `! grep`: set -e ignores the failure of an
        # inverted command, which made the first version of this gate inert.
        run: |
          if grep -riE 'smoltcp|\btcp\b|\budp\b|socket|ethernet|e1000|virtio|dhcp|\bdns\b|\bhttp\b' \
              kernel/src kshared/src kernel/Cargo.toml; then
            echo "network token found in the kernel tree" >&2
            exit 1
          fi
          if grep -riE 'fatfs|ext[234]|nvme|ahci|\bata\b|\bide\b|\bsata\b' \
              kernel/src kshared/src kernel/Cargo.toml; then
            echo "storage token found in the kernel tree" >&2
            exit 1
          fi
          echo "no network or storage tokens in the kernel"

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kshared

  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot selftest (${{ matrix.firmware }})
        # shell: bash is load-bearing: it turns on pipefail, without which a
        # failed boot would be masked by tee's exit status and go green.
        shell: bash
        run: cargo xtask test --${{ matrix.firmware }} | tee serial-${{ matrix.firmware }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-${{ matrix.firmware }}
          path: serial-*.log

  # The battery proves the selftest build; this proves the image users
  # actually boot reaches the shell.
  boot-shipped:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot the shipped image
        # shell: bash for pipefail — see the boot-test note.
        shell: bash
        run: cargo xtask test --shipped | tee serial-shipped.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-shipped
          path: serial-shipped.log
