[package]
name = "kernel"
version = "0.5.0"
edition = "2024"
publish = false

[dependencies]
bootloader_api = "0.11.17"
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
kshared = { path = "../kshared" }
linked_list_allocator = "0.10.6"
log = { version = "0.4", default-features = false }
noto-sans-mono-bitmap = "0.3.2"
pc-keyboard = "0.9"
pic8259 = "0.11"
spin = "0.12"
uart_16550 = "0.3"
x86_64 = "0.15.5"

[features]
# Runs the in-kernel self-test battery at boot and exits QEMU with a verdict.
selftest = []
